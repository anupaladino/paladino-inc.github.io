<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Credenciais ATF</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');

    :root {
      --scale: 1;
      --black: #000000;
      --white: #ffffff;
      --font-primary: "Plus Jakarta Sans", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--black);
      font-family: var(--font-primary);
      overflow: hidden;
    }

    .presentation {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--black);
    }


    .presentation {
      position: relative;
    }

    .presentation .slide {
      will-change: opacity;
    }

    img[data-src]:not([src]),
    video[data-src]:not([src]) {
      visibility: hidden;
    }

    .slide {
      position: absolute;
      width: 1920px;
      height: 1080px;
      background: var(--white);
      overflow: hidden;
      opacity: 0;
      transform: scale(var(--scale));
      transform-origin: center center;
      transition: opacity 500ms ease;
      pointer-events: none;
    }

    .slide.active {
      opacity: 1;
      pointer-events: auto;
      z-index: 2;
    }

    .logo-video {
      position: absolute;
      inset: -4px;
      width: calc(100% + 8px);
      height: calc(100% + 8px);
      object-fit: cover;
      z-index: 0;
      backface-visibility: hidden;
      transform-style: preserve-3d;
    }

    .bg {
      position: absolute;
      inset: -4px;
      width: calc(100% + 8px);
      height: calc(100% + 8px);
      object-fit: cover;
      z-index: 0;
      backface-visibility: hidden;
      transform-style: preserve-3d;
    }

    .motion-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      width: calc(100% + 8px);
      height: calc(100% + 8px);
      object-fit: cover;
      z-index: 0;
      transform: translate(-50%, -50%) translateX(var(--motion-x, 0px)) translateY(var(--motion-y, 0px)) scale(var(--motion-scale, 1));
      transform-origin: center center;
      backface-visibility: hidden;
      transform-style: preserve-3d;
    }

    .motion-shift-right {
      --motion-x: 300px;
      background: var(--black);
    }

    .payment-motion-mask {
      position: absolute;
      left: 0;
      top: 0;
      width: 740px;
      height: 100%;
      background: var(--black);
      z-index: 1;
      pointer-events: none;
    }

    .logo-top {
      position: absolute;
      left: 64px;
      top: 64px;
      z-index: 3;
    }

    .symbol-footer {
      position: absolute;
      left: 64px;
      top: 988px;
      width: 64.84px;
      height: 28.2px;
      z-index: 3;
    }

    .text-layer {
      position: absolute;
      z-index: 2;
    }

    .highlight {
      position: absolute;
      z-index: 1;
      display: block;
      object-fit: fill;
      pointer-events: none;
      transform-origin: left center;
    }



    .brand-footer {
      position: absolute;
      left: 64px;
      top: 988px;
      height: 28.2px;
      z-index: 3;
    }

    .brand-footer.asset {
      width: 266.52px;
    }

    .brand-footer.fintech {
      width: 310.96px;
    }

    .metric-line {
      position: absolute;
      display: flex;
      align-items: baseline;
      z-index: 2;
      color: var(--white);
      white-space: nowrap;
    }

    .text-number-large {
      font-family: var(--font-primary);
      font-weight: 800;
      font-size: 150px;
      line-height: 131.2px;
      letter-spacing: -0.01em;
    }

    .metric-line .text-statement-large-inline {
      font-family: var(--font-primary);
      font-weight: 700;
      font-size: 96px;
      line-height: 100%;
      letter-spacing: -0.01em;
      margin-left: 24px;
    }

    /* Type System */
    .text-caption {
      position: absolute;
      font-family: var(--font-primary);
      font-weight: 700;
      font-size: 21px;
      line-height: 120%;
      letter-spacing: -0.01em;
    }

    .text-body-large {
      position: absolute;
      font-family: var(--font-primary);
      font-weight: 600;
      font-size: 48px;
      line-height: 55px;
      letter-spacing: -0.01em;
    }

    .text-statement-small {
      position: absolute;
      font-family: var(--font-primary);
      font-weight: 700;
      font-size: 64px;
      line-height: 110%;
      letter-spacing: -0.01em;
    }

    .text-statement-medium {
      position: absolute;
      font-family: var(--font-primary);
      font-weight: 700;
      font-size: 73px;
      line-height: 80px;
      letter-spacing: -0.01em;
    }

    .text-statement-large {
      position: absolute;
      font-family: var(--font-primary);
      font-weight: 700;
      font-size: 96px;
      line-height: 100%;
      letter-spacing: -0.01em;
    }

    .text-display-medium {
      position: absolute;
      font-family: var(--font-primary);
      font-weight: 700;
      font-size: 108px;
      line-height: 110px;
      letter-spacing: -0.01em;
    }

    .text-display-large {
      position: absolute;
      font-family: var(--font-primary);
      font-weight: 500;
      font-size: 164px;
      line-height: 140px;
      letter-spacing: -0.01em;
    }

    .black { color: var(--black); }
    .white { color: var(--white); }

    a {
      color: inherit;
      text-decoration: none;
    }


    .fade-up {
      opacity: 0;
      transform: translateY(28px);
    }

    .slide.active .fade-up {
      animation: paragraphEnter 850ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: 180ms;
    }

    .slide.active .fade-up.delay-1 { animation-delay: 320ms; }
    .slide.active .fade-up.delay-2 { animation-delay: 460ms; }

    .highlight-reveal {
      opacity: 0;
      transform: scaleX(0);
    }

    .slide.active .highlight-reveal {
      animation: highlightReveal 650ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: 900ms;
    }

    .slide.active .highlight-reveal.delay-1 { animation-delay: 1040ms; }
    .slide.active .highlight-reveal.delay-2 { animation-delay: 1180ms; }

    @keyframes paragraphEnter {
      from { opacity: 0; transform: translateY(28px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes highlightReveal {
      from { opacity: 0; transform: scaleX(0); }
      to { opacity: 1; transform: scaleX(1); }
    }

    .text-contact {
      position: absolute;
      font-family: var(--font-primary);
      font-weight: 700;
      font-size: 32px;
      line-height: 130%;
      letter-spacing: -0.01em;
    }

    .logo-atf-final {
      position: absolute;
      z-index: 3;
    }


    /* Mobile horizontal support: keeps the 16:9 presentation intact and adds a lightweight companion layer. */
    .mobile-rotate-notice,
    .mobile-fullscreen-button {
      display: none;
    }

    @media (max-width: 900px) {
      html,
      body {
        width: 100dvw;
        height: 100dvh;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        touch-action: manipulation;
      }

      .presentation {
        width: 100dvw;
        height: 100dvh;
      }

      .slide {
        will-change: opacity, transform;
      }

      .mobile-fullscreen-button {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 10002;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.42);
        color: var(--white);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        opacity: 0.72;
        transition: opacity 180ms ease, background 180ms ease, transform 180ms ease;
      }

      .mobile-fullscreen-button::before {
        content: "";
        width: 18px;
        height: 18px;
        display: block;
        background: currentColor;
        -webkit-mask: url("data:image/svg+xml,%3Csvg width='24' height='24' viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M5 5h6v2H7v4H5V5Zm8 0h6v6h-2V7h-4V5ZM5 13h2v4h4v2H5v-6Zm12 0h2v6h-6v-2h4v-4Z'/%3E%3C/svg%3E") center / contain no-repeat;
        mask: url("data:image/svg+xml,%3Csvg width='24' height='24' viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M5 5h6v2H7v4H5V5Zm8 0h6v6h-2V7h-4V5ZM5 13h2v4h4v2H5v-6Zm12 0h2v6h-6v-2h4v-4Z'/%3E%3C/svg%3E") center / contain no-repeat;
      }

      .mobile-fullscreen-button:hover,
      .mobile-fullscreen-button:focus-visible {
        opacity: 1;
        background: rgba(0, 0, 0, 0.62);
        transform: translateY(-1px);
      }

      body.is-fullscreen .mobile-fullscreen-button {
        opacity: 0;
        pointer-events: none;
      }

    }

    @media (max-width: 900px) and (orientation: portrait) {
      .mobile-rotate-notice {
        position: fixed;
        inset: 0;
        z-index: 10003;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 32px;
        background: var(--black);
        color: var(--white);
        text-align: center;
        font-family: var(--font-primary);
      }

      .mobile-rotate-material-icon {
        width: 64px;
        height: 64px;
        display: block;
        opacity: 0.94;
      }

      .mobile-rotate-title {
        max-width: 320px;
        font-size: 24px;
        line-height: 110%;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .mobile-rotate-copy {
        max-width: 320px;
        font-size: 14px;
        line-height: 140%;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.68);
      }

      .mobile-fullscreen-button {
        display: none;
      }
    }

    @media (max-width: 900px) and (orientation: landscape) {
      .mobile-rotate-notice {
        display: none;
      }
    }


  </style>
</head>

    <div class="mobile-rotate-title">Gire o celular para visualizar.</div>
    <div class="mobile-rotate-copy">Esta apresentação foi desenhada em formato horizontal. Para melhor leitura, use o aparelho na orientação paisagem.</div>
  </div>

  <script>
    const presentation = document.querySelector('.presentation');
    const template = document.querySelector('#slides-template');
    const slideTemplates = Array.from(template.content.querySelectorAll('.slide'));
    const fullscreenButton = document.querySelector('.mobile-fullscreen-button');

    let current = 0;
    let currentSlide = null;
    let isTransitioning = false;
    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;

    function viewportSize() {
      const visualViewport = window.visualViewport;
      return {
        width: visualViewport ? visualViewport.width : window.innerWidth,
        height: visualViewport ? visualViewport.height : window.innerHeight,
      };
    }

    function setScale() {
      const viewport = viewportSize();
      const scale = Math.min(viewport.width / 1920, viewport.height / 1080);
      document.documentElement.style.setProperty('--scale', scale);
    }

    function prepareVideo(video) {
      video.muted = true;
      video.playsInline = true;
      video.setAttribute('muted', '');
      video.setAttribute('playsinline', '');
      video.setAttribute('webkit-playsinline', '');
      video.setAttribute('preload', 'auto');
      video.disablePictureInPicture = true;
    }

    function ensureMedia(node) {
      node.querySelectorAll('img[data-src]').forEach((img) => {
        if (!img.getAttribute('src')) {
          img.setAttribute('src', img.dataset.src);
        }
      });

      node.querySelectorAll('video[data-src]').forEach((video) => {
        prepareVideo(video);
        if (!video.getAttribute('src')) {
          video.setAttribute('src', video.dataset.src);
          try { video.load(); } catch (error) {}
        }
      });
    }

    function releaseMedia(node) {
      if (!node) return;

      node.querySelectorAll('video').forEach((video) => {
        video.pause();
        try { video.currentTime = 0; } catch (error) {}
        if (video.dataset.src) {
          video.removeAttribute('src');
          video.setAttribute('preload', 'none');
          try { video.load(); } catch (error) {}
        }
      });

      node.querySelectorAll('img[data-src]').forEach((img) => {
        img.removeAttribute('src');
      });
    }

    function playVideos(node) {
      if (!node) return;
      node.querySelectorAll('video').forEach((video) => {
        prepareVideo(video);
        if (!video.getAttribute('src') && video.dataset.src) {
          video.setAttribute('src', video.dataset.src);
          try { video.load(); } catch (error) {}
        }
        try { video.currentTime = 0; } catch (error) {}
        video.play().catch(() => {});
      });
    }

    function restartAnimations(node) {
      if (!node) return;
      node.querySelectorAll('*').forEach((el) => {
        el.style.animation = 'none';
        el.offsetHeight;
        el.style.animation = '';
      });
    }

    function buildSlide(index) {
      const source = slideTemplates[index];
      if (!source) return null;

      const slide = source.cloneNode(true);
      slide.classList.remove('active');
      slide.setAttribute('data-rendered-slide', String(index + 1));
      ensureMedia(slide);
      return slide;
    }

    function mountInitialSlide() {
      const firstSlide = buildSlide(current);
      if (!firstSlide) return;

      presentation.appendChild(firstSlide);
      firstSlide.offsetHeight;
      firstSlide.classList.add('active');
      currentSlide = firstSlide;

      restartAnimations(firstSlide);
      playVideos(firstSlide);
    }

    function showSlide(index) {
      const next = Math.max(0, Math.min(index, slideTemplates.length - 1));
      if (next === current || isTransitioning) return;

      const previousSlide = currentSlide;
      const nextSlide = buildSlide(next);
      if (!nextSlide) return;

      isTransitioning = true;
      presentation.appendChild(nextSlide);

      // Force layout so the opacity transition starts from 0.
      nextSlide.offsetHeight;

      if (previousSlide) previousSlide.classList.remove('active');
      current = next;
      nextSlide.classList.add('active');
      currentSlide = nextSlide;

      restartAnimations(nextSlide);
      playVideos(nextSlide);

      window.setTimeout(() => {
        if (previousSlide && previousSlide !== currentSlide) {
          releaseMedia(previousSlide);
          previousSlide.remove();
        }
        isTransitioning = false;
      }, 650);
    }

    function nextSlide() {
      showSlide(current + 1);
    }

    function previousSlide() {
      showSlide(current - 1);
    }

    function isInteractiveTarget(target) {
      return Boolean(target.closest('a, button, input, textarea, select, summary'));
    }

    function enterPresentationModeFallback() {
      document.body.classList.add('is-pseudo-fullscreen');
      document.body.classList.add('is-fullscreen');

      // iOS não permite fullscreen real para páginas abertas como link comum.
      // Esse fallback mantém a apresentação no viewport e remove o controle visual.
      try { window.scrollTo(0, 1); } catch (error) {}
      window.setTimeout(setScale, 120);
    }

    function requestPresentationFullscreen() {
      const target = document.documentElement;
      const request = target.requestFullscreen || target.webkitRequestFullscreen || target.msRequestFullscreen;

      if (!request) {
        enterPresentationModeFallback();
        return;
      }

      try {
        const result = request.call(target);
        if (result && typeof result.catch === 'function') {
          result.catch(() => enterPresentationModeFallback());
        } else {
          window.setTimeout(updateFullscreenState, 180);
        }
      } catch (error) {
        enterPresentationModeFallback();
      }
    }

    function updateFullscreenState() {
      const isNativeFullscreen = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
      const isPseudoFullscreen = document.body.classList.contains('is-pseudo-fullscreen');
      document.body.classList.toggle('is-fullscreen', isNativeFullscreen || isPseudoFullscreen);
    }

    window.addEventListener('resize', setScale);
    window.addEventListener('orientationchange', () => window.setTimeout(setScale, 350));

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', setScale);
    }

    document.addEventListener('fullscreenchange', updateFullscreenState);
    document.addEventListener('webkitfullscreenchange', updateFullscreenState);

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        currentSlide?.querySelectorAll('video').forEach((video) => video.pause());
      } else {
        playVideos(currentSlide);
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowRight' || event.key === ' ') {
        event.preventDefault();
        nextSlide();
      }
      if (event.key === 'ArrowLeft') {
        event.preventDefault();
        previousSlide();
      }
      if (event.key.toLowerCase() === 'f') {
        requestPresentationFullscreen();
      }
    });

    document.addEventListener('touchstart', (event) => {
      if (event.changedTouches.length !== 1) return;
      touchStartX = event.changedTouches[0].clientX;
      touchStartY = event.changedTouches[0].clientY;
      touchStartTime = Date.now();
    }, { passive: true });

    document.addEventListener('touchend', (event) => {
      if (event.changedTouches.length !== 1 || isInteractiveTarget(event.target)) return;

      const touchEndX = event.changedTouches[0].clientX;
      const touchEndY = event.changedTouches[0].clientY;
      const deltaX = touchEndX - touchStartX;
      const deltaY = touchEndY - touchStartY;
      const elapsed = Date.now() - touchStartTime;
      const viewport = viewportSize();

      if (Math.abs(deltaX) > 48 && Math.abs(deltaX) > Math.abs(deltaY) * 1.25) {
        if (deltaX < 0) nextSlide();
        if (deltaX > 0) previousSlide();
        return;
      }

      if (Math.abs(deltaX) < 18 && Math.abs(deltaY) < 18 && elapsed < 450 && viewport.width > viewport.height) {
        if (touchEndX > viewport.width * 0.66) nextSlide();
        if (touchEndX < viewport.width * 0.34) previousSlide();
      }
    }, { passive: true });

    if (fullscreenButton) {
      fullscreenButton.addEventListener('click', (event) => {
        event.stopPropagation();
        requestPresentationFullscreen();
        playVideos(currentSlide);
      });
    }

    setScale();
    updateFullscreenState();
    mountInitialSlide();
  </script>
